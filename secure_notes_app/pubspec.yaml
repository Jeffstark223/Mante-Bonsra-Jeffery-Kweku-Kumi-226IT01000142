name: secure_notes_app
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.15.1 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  local_auth: ^2.1.0
  flutter_secure_storage: ^5.0.2
  crypto: ^3.0.1
  encrypt: ^5.0.1
  provider: ^6.0.2
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.0
  flutter_launcher_icons: ^0.9.3
  flutter_native_splash: ^1.2.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

flutter_native_splash:
  color: "#42a5f5"
  image: assets/splash.png
  android: true
  ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/splash.png