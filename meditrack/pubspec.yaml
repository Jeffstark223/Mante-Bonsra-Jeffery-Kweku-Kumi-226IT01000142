name: meditrack
description: A medication and health tracking app.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.15.1 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.2

  # Local Notifications
  flutter_local_notifications: ^9.4.0
  timezone: ^0.8.0

  # UI & Charts
  fl_chart: ^0.36.0
  cupertino_icons: ^1.0.4
  google_fonts: ^2.2.0
  intl: ^0.17.0

  # Utilities
  uuid: ^3.0.6
  shared_preferences: ^2.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/